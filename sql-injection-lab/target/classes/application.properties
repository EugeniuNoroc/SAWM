# ── Порт приложения ──
server.port=8080

# ── Встроенная БД H2 в оперативной памяти (установка СУБД не нужна) ──
spring.datasource.url=jdbc:h2:mem:labdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ── Веб-консоль H2 для просмотра таблицы "user": http://localhost:8080/h2-console ──
# (JDBC URL в консоли: jdbc:h2:mem:labdb, пользователь sa, пароль пустой)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ── Thymeleaf: отключаем кэш шаблонов при разработке ──
spring.thymeleaf.cache=false
