server.port=8080

# Встроенная БД H2 в памяти (имя базы — guest)
spring.datasource.url=jdbc:h2:mem:guest;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Консоль для просмотра таблицы: http://localhost:8080/h2-console  (JDBC URL: jdbc:h2:mem:guest)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.thymeleaf.cache=false
